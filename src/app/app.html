<div class="bg-background text-foreground min-h-dvh font-sans">
  <header class="border-b border-border px-6 py-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-lg font-semibold tracking-tight">Flow tests</h1>
        <p class="text-muted-foreground mt-0.5 text-sm">Spartan POC routes</p>
      </div>
      <nav class="flex flex-wrap gap-3 text-sm">
        <a
          routerLink="/pos-demo"
          routerLinkActive="text-foreground font-semibold underline decoration-2 underline-offset-4"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-muted-foreground hover:text-foreground"
          >Transactions</a>
        <a
          routerLink="/pos"
          routerLinkActive="text-foreground font-semibold underline decoration-2 underline-offset-4"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-muted-foreground hover:text-foreground"
          >POS checkout</a>
      </nav>
    </div>
  </header>
  <main class="p-6">
    <router-outlet />
  </main>
</div>
